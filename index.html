<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BirthdayOS-v23.08.2026</title>
    <style>
        /* ШРИФТ И СБРОС СТИЛЕЙ */
        @font-face {
            font-family: 'Pixel';
            src: url('https://fonts.cdnfonts.com/s/77332/Pixelated.woff') format('woff');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pixel', 'Courier New', monospace;
            user-select: none; /* Запрет выделения текста для ощущения ОС */
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #000;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            height: 30px;
            background-color: #1a1a1a;
            color: #ff00ff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #333;
            font-size: 13px;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* РОЗОВО-ЧЁРНЫЙ КЛЕТЧАТЫЙ ФОН */
        .desktop {
            flex: 1;
            background-color: #ff00ff;
            background-image:
                linear-gradient(45deg, #000 25%, transparent 25%),
                linear-gradient(-45deg, #000 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #000 75%),
                linear-gradient(-45deg, transparent 75%, #000 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 35px;
            position: relative;
        }

        /* ИКОНКИ НА РАБОЧЕМ СТОЛЕ */
        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
            cursor: pointer;
            text-decoration: none;
        }

        .icon-image {
            font-size: 42px;
            padding: 4px;
            border: 2px solid transparent;
            transition: transform 0.1s;
        }

        .icon:active .icon-image {
            transform: scale(0.95);
        }

        .icon-text {
            font-size: 13px;
            text-align: center;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 2px;
            margin-top: 4px;
            border: 1px dashed #ff00ff;
        }

        /* РЕТРО-ОКНА */
        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 380px;
            background-color: #c0c0c0;
            border: 3px solid;
            border-color: #fff #808080 #808080 #fff;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .window-header {
            height: 28px;
            background: linear-gradient(90deg, #800080 0%, #ff00ff 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            font-weight: bold;
            font-size: 13px;
        }

        .window-controls {
            display: flex;
            gap: 3px;
        }

        .win-btn {
            width: 18px;
            height: 18px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .win-btn:active {
            border-color: #808080 #fff #fff #808080;
        }

        .win-btn.close {
            background-color: #ff4500;
            color: white;
        }

        .window-body {
            padding: 12px;
            background-color: #fff;
            margin: 3px;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            max-height: 350px;
            overflow-y: auto;
        }

        /* СТИЛИ БЛОКНОТА */
        .notepad-text {
            width: 100%;
            height: 180px;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #000;
            background: transparent;
            user-select: text;
        }

        /* СТИЛИ ИГРЫ ПОЖЕЛАНИЯ */
        .game-status {
            font-size: 12px;
            color: #333;
            text-align: center;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .game-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            justify-items: center;
        }

        .gift-box {
            width: 75px;
            height: 75px;
            background-color: #ffb6c1;
            border: 3px solid;
            border-color: #fff #ff69b4 #ff69b4 #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            text-align: center;
            padding: 2px;
        }

        .gift-box.open {
            background-color: #fff0f5;
            border-color: #808080 #fff #fff #808080;
            cursor: default;
        }

        .gift-icon {
            font-size: 24px;
        }

        .wish-text {
            display: none;
            font-size: 9px;
            font-weight: bold;
            color: #800080;
            margin-top: 2px;
            word-break: break-word;
        }

        .gift-box.open .wish-text {
            display: block;
        }

        /* НИЖНЯЯ ПАНЕЛЬ (TASKBAR) */
        .taskbar {
            height: 38px;
            background-color: #c0c0c0;
            border-top: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            z-index: 10;
        }

        .start-button {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 3px 8px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .start-button:active {
            border-color: #808080 #fff #fff #808080;
        }

        .start-icon {
            width: 14px;
            height: 14px;
            background: #ff00ff;
            border: 1px solid #000;
        }

        .tray {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            padding: 2px 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        BirthdayOS-v23.08.2026
    </div>

    <!-- РАБОЧИЙ СТОЛ -->
    <div class="desktop">

        <!-- ИКОНКА 1: sdr.txt -->
        <div class="icon" onclick="openWindow('notepad')">
            <div class="icon-image">📝</div>
            <div class="icon-text">sdr.txt</div>
        </div>

        <!-- ИКОНКА 2: pojelania.exe -->
        <div class="icon" onclick="openWindow('game')">
            <div class="icon-image">🎂</div>
            <div class="icon-text">pojelania.exe</div>
        </div>

    </div>

    <!-- ОКНО 1: БЛОКНОТ (sdr.txt) -->
    <div class="window" id="window-notepad">
        <div class="window-header">
            <span>📝 sdr.txt - Блокнот</span>
            <div class="window-controls">
                <button class="win-btn close" onclick="closeWindow('notepad')">X</button>
            </div>
        </div>
        <div class="window-body">
            <textarea class="notepad-text" readonly>
Привет! С Днём Рождения! 🎉

Вот и настал этот день. Желаю тебе оставаться таким же крутым и оригинальным человеком!

Пусть в жизни всё складывается легко, мечты исполняются, а каждый день приносит только крутые эмоции. 

Заходи скорее в pojelania.exe и забирай свои подарки! 🚀
            </textarea>
        </div>
    </div>

    <!-- ОКНО 2: ИГРА (pojelania.exe) -->
    <div class="window" id="window-game">
        <div class="window-header">
            <span>🎂 pojelania.exe</span>
            <div class="window-controls">
                <button class="win-btn close" onclick="closeWindow('game')">X</button>
            </div>
        </div>
        <div class="window-body">
            <div class="game-status">Нажимай на блочки, чтобы открыть пожелания!</div>
            <div class="game-area" id="game-area"></div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="taskbar">
        <div class="start-button" onclick="alert('System status: Birthday mode Active! 🎉')">
            <div class="start-icon"></div>
            Пуск
        </div>
        <div class="tray">
            <span title="Сеть">🌐</span>
            <span title="Звук">🔊</span>
            <span id="time">12:00</span>
        </div>
    </div>

    <script>
        // 1. ЧАСЫ В ПАНЕЛИ
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;
        }
        updateTime();
        setInterval(updateTime, 10000);

        // 2. ЛОГИКА ОКЕН
        function openWindow(id) {
            closeAll();
            document.getElementById('window-' + id).style.display = 'flex';
            if (id === 'game') {
                initGame();
            }
        }

        function closeWindow(id) {
            document.getElementById('window-' + id).style.display = 'none';
        }

        function closeAll() {
            const windows = document.querySelectorAll('.window');
            windows.forEach(win => win.style.display = 'none');
        }

        // 3. ИГРА ПОЖЕЛАНИЯ
        const wishes = [
            { text: "ДЕНЬГИ", icon: "💰" },
            { text: "ЗДОРОВЬЕ", icon: "🏥" },
            { text: "ЛЮБОВЬ", icon: "❤️" },
            { text: "УСПЕХ", icon: "🏆" },
            { text: "СЧАСТЬЕ", icon: "✨" },
            { text: "ДРУЗЬЯ", icon: "🤝" },
            { text: "ВАЙБ", icon: "🎧" },
            { text: "МЕЧТЫ", icon: "🚀" },
            { text: "УДАЧА", icon: "🍀" }
        ];

        function initGame() {
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = '';

            wishes.forEach((wish, index) => {
                const box = document.createElement('div');
                box.className = 'gift-box';
                box.id = `gift-${index}`;
                box.onclick = () => openGift(index);

                const icon = document.createElement('div');
                icon.className = 'gift-icon';
                icon.textContent = '❓';

                const text = document.createElement('div');
                text.className = 'wish-text';
                text.textContent = wish.text;

                box.appendChild(icon);
                box.appendChild(text);
                gameArea.appendChild(box);
            });
        }

        function openGift(index) {
            const box = document.getElementById(`gift-${index}`);
            if (box.classList.contains('open')) return;

            box.classList.add('open');
            const wish = wishes[index];
            const iconDiv = box.querySelector('.gift-icon');
            iconDiv.textContent = wish.icon;

            // Проверка на завершение игры
            if (document.querySelectorAll('.gift-box.open').length === wishes.length) {
                setTimeout(() => alert("🎉 Все пожелания найдены! Пусть они обязательно сбудутся!"), 300);
            }
        }
    </script>
</body>
</html>
