<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BirthdayOS-v23.08.2026</title>
    <style>
        /* ОСНОВНЫЕ СТИЛИ (РЕТРО-ШРИФТ И СБРОС) */
        @font-face {
            font-family: 'Pixel';
            src: url('https://fonts.cdnfonts.com/s/77332/Pixelated.woff') format('woff');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pixel', 'Courier New', monospace;
            image-rendering: pixelated; /* Чтобы иконки были пиксельными */
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Чтобы не было полос прокрутки */
        }

        /* РОЗОВО-ЧЁРНЫЙ КЛЕТЧАТЫЙ ФОН (CSS) */
        .desktop {
            flex: 1;
            background-color: #ff00ff; /* Розовый по умолчанию */
            background-image:
                linear-gradient(45deg, #000 25%, transparent 25%),
                linear-gradient(-45deg, #000 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #000 75%),
                linear-gradient(-45deg, transparent 75%, #000 75%);
            background-size: 40px 40px; /* Размер клетки */
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center; /* Центрируем иконки по горизонтали */
            justify-content: center; /* Центрируем иконки по вертикали */
            gap: 30px; /* Отступ между иконками */
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            height: 30px;
            background-color: #333;
            color: #ff00ff; /* Розовый текст */
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #555;
            font-size: 14px;
        }

        /* НИЖНЯЯ ПАНЕЛЬ (TASKBAR) */
        .taskbar {
            height: 40px;
            background-color: #c0c0c0; /* Классический серый ретро */
            border-top: 2px solid #fff; /* Эффект выпуклости */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .start-button {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff; /* Эффект 3D кнопки */
            padding: 2px 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .start-button:active {
            border-color: #808080 #fff #fff #808080; /* Кнопка нажата */
        }

        .tray {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #e0e0e0;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080; /* Эффект "впуклости" */
            padding: 2px 5px;
        }

        .tray-icon {
            width: 16px;
            height: 16px;
            background: #555; /* Заглушка для иконок */
        }

    </style>
</head>
<body>

    <div class="top-bar">
        <span>BirthdayOS-v23.08.2026</span>
    </div>

    <div class="desktop">
        </div>

    <div class="taskbar">
        <div class="start-button">
            <div style="width:16px; height:16px; background:#ff00ff; border:1px solid #000;"></div> Пуск
        </div>
        <div class="tray">
            <div class="tray-icon" title="Звук">🔊</div>
            <div class="tray-icon" title="Сеть">🌐</div>
            <span id="time">12:00</span>
        </div>
    </div>

    <script>
        // СКРИПТ ЧАСОВ
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;
        }
        updateTime();
        setInterval(updateTime, 10000); // Обновлять каждые 10 сек
    </script>
</body>
</html>
