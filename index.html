<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BirthdayOS-v23.08.2026</title>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('https://fonts.cdnfonts.com/s/77332/Pixelated.woff') format('woff');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pixel', 'Courier New', monospace;
            user-select: none;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #000;
        }

        /* УВЕЛИЧЕННАЯ ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            height: 65px;
            background-color: #121212;
            color: #ff66cc;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #333;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            z-index: 10;
            padding-top: env(safe-area-inset-top, 0px);
        }

        /* ПРИТЕМНЁННЫЙ КЛЕТЧАТЫЙ ФОН */
        .desktop {
            flex: 1;
            background-color: #8b008b;
            background-image:
                linear-gradient(45deg, #0a0a0a 25%, transparent 25%),
                linear-gradient(-45deg, #0a0a0a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #0a0a0a 75%),
                linear-gradient(-45deg, transparent 75%, #0a0a0a 75%);
            background-size: 44px 44px;
            background-position: 0 0, 0 22px, 22px -22px, -22px 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            position: relative;
        }

        /* ИКОНКИ НА РАБОЧЕМ СТОЛЕ */
        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
            cursor: pointer;
        }

        .icon-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .icon-text {
            font-size: 14px;
            text-align: center;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 3px 8px;
            border-radius: 3px;
            margin-top: 6px;
            border: 1px dashed #ff66cc;
        }

        /* РЕТРО-ОКНА */
        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 380px;
            background-color: #c0c0c0;
            border: 3px solid;
            border-color: #fff #808080 #808080 #fff;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .window-header {
            height: 32px;
            background: linear-gradient(90deg, #660066 0%, #cc00cc 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .window-controls {
            display: flex;
            gap: 4px;
        }

        .win-btn {
            width: 22px;
            height: 22px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .win-btn:active {
            border-color: #808080 #fff #fff #808080;
        }

        .win-btn.close {
            background-color: #ff4500;
            color: white;
        }

        .window-body {
            padding: 12px;
            background-color: #fff;
            margin: 3px;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            max-height: 350px;
            overflow-y: auto;
        }

        .notepad-text {
            width: 100%;
            height: 180px;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #000;
            background: transparent;
            user-select: text;
        }

        /* ИГРА ПОЖЕЛАНИЯ */
        .game-status {
            font-size: 13px;
            color: #333;
            text-align: center;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .game-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            justify-items: center;
        }

        .gift-box {
            width: 75px;
            height: 75px;
            background-color: #ffb6c1;
            border: 3px solid;
            border-color: #fff #ff69b4 #ff69b4 #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            text-align: center;
            padding: 2px;
        }

        .gift-box.open {
            background-color: #fff0f5;
            border-color: #808080 #fff #fff #808080;
            cursor: default;
        }

        .gift-icon {
            font-size: 24px;
        }

        .wish-text {
            display: none;
            font-size: 9px;
            font-weight: bold;
            color: #800080;
            margin-top: 2px;
            word-break: break-word;
        }

        .gift-box.open .wish-text {
            display: block;
        }

        /* ПОДГОНЕННАЯ НИЖНЯЯ ПАНЕЛЬ ПОД СТРОКУ IPHONE */
        .taskbar {
            background-color: #c0c0c0;
            border-top: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 6px;
            padding-left: 8px;
            padding-right: 8px;
            padding-bottom: max(38px, env(safe-area-inset-bottom));
            z-index: 10;
        }

        .start-button {
            height: 36px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 0 12px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .start-button:active {
            border-color: #808080 #fff #fff #808080;
        }

        .start-icon {
            width: 18px;
            height: 18px;
            background: #cc00cc;
            border: 1px solid #000;
        }

        .taskbar-games {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .game-shortcut, .tray-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .tray {
            height: 36px;
            display: flex;
            gap: 6px;
            align-items: center;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            padding: 0 8px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        BirthdayOS-v23.08.2026
    </div>

    <!-- РАБОЧИЙ СТОЛ -->
    <div class="desktop">

        <!-- ИКОНКА 1: sdr.txt -->
        <div class="icon" onclick="openWindow('notepad')">
            <img src="https://win98icons.alexmeub.com/icons/png/notepad-0.png" class="icon-img" alt="sdr.txt">
            <div class="icon-text">sdr.txt</div>
        </div>

        <!-- ИКОНКА 2: pojelania.exe (ВСТРОЕННЫЙ SVG ТОРТ) -->
        <div class="icon" onclick="openWindow('game')">
            <svg class="icon-img" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="4" width="2" height="6" fill="#00ffff"/>
                <rect x="15" y="4" width="2" height="6" fill="#ffff00"/>
                <rect x="20" y="4" width="2" height="6" fill="#00ffff"/>
                <rect x="10" y="2" width="2" height="2" fill="#ff4500"/>
                <rect x="15" y="2" width="2" height="2" fill="#ff4500"/>
                <rect x="20" y="2" width="2" height="2" fill="#ff4500"/>
                <rect x="6" y="10" width="20" height="6" fill="#ff69b4"/>
                <rect x="6" y="10" width="20" height="2" fill="#ffffff"/>
                <rect x="4" y="16" width="24" height="6" fill="#ba55d3"/>
                <rect x="4" y="16" width="24" height="2" fill="#ffb6c1"/>
                <rect x="2" y="22" width="28" height="6" fill="#8a2be2"/>
                <rect x="2" y="22" width="28" height="2" fill="#ffffff"/>
                <rect x="0" y="28" width="32" height="2" fill="#c0c0c0"/>
            </svg>
            <div class="icon-text">pojelania.exe</div>
        </div>

    </div>

    <!-- ОКНО 1: БЛОКНОТ -->
    <div class="window" id="window-notepad">
        <div class="window-header">
            <span>📝 sdr.txt - Блокнот</span>
            <div class="window-controls">
                <button class="win-btn close" onclick="closeWindow('notepad')">X</button>
            </div>
        </div>
        <div class="window-body">
            <textarea class="notepad-text" readonly>
Привет! С Днём Рождения! 🎉

Вот и настал этот день. Желаю тебе оставаться таким же крутым и оригинальным человеком!

Пусть в жизни всё складывается легко, мечты исполняются, а каждый день приносит только крутые эмоции. 

Заходи скорее в pojelania.exe и забирай свои подарки! 🚀
            </textarea>
        </div>
    </div>

    <!-- ОКНО 2: ИГРА ПОЖЕЛАНИЯ -->
    <div class="window" id="window-game">
        <div class="window-header">
            <span>🎂 pojelania.exe</span>
            <div class="window-controls">
                <button class="win-btn close" onclick="closeWindow('game')">X</button>
            </div>
        </div>
        <div class="window-body">
            <div class="game-status">Нажимай на блочки, чтобы открыть пожелания!</div>
            <div class="game-area" id="game-area"></div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="taskbar">
        <div class="start-button" onclick="alert('System status: Birthday mode Active! 🎉')">
            <div class="start-icon"></div>
            Пуск
        </div>

        <div class="taskbar-games">
            <img src="https://win98icons.alexmeub.com/icons/png/game_freecell-0.png" class="game-shortcut" title="Solitaire" alt="game">
            
            <!-- ВШИТАЯ ПИКСЕЛЬНАЯ ИКОНКА САПЁРА -->
            <svg class="game-shortcut" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="16" height="16" fill="#c0c0c0"/>
                <rect x="1" y="1" width="14" height="14" fill="#000000"/>
                <rect x="2" y="2" width="12" height="12" fill="#c0c0c0"/>
                <circle cx="8" cy="9" r="4" fill="#000000"/>
                <rect x="7" y="3" width="2" height="2" fill="#ff0000"/>
                <rect x="7" y="5" width="2" height="1" fill="#000000"/>
                <rect x="5" y="7" width="2" height="2" fill="#ffffff"/>
            </svg>

            <img src="https://win98icons.alexmeub.com/icons/png/joystick-0.png" class="game-shortcut" title="Joystick" alt="game">
        </div>

        <div class="tray">
            <!-- ВШИТАЯ ПИКСЕЛЬНАЯ ИКОНКА СЕТИ -->
            <svg class="tray-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="16" height="16" fill="#c0c0c0"/>
                <rect x="1" y="2" width="8" height="6" fill="#000080"/>
                <rect x="2" y="3" width="6" height="4" fill="#00ffff"/>
                <rect x="7" y="7" width="8" height="6" fill="#000080"/>
                <rect x="8" y="8" width="6" height="4" fill="#00ffff"/>
                <path d="M5 8v3h4" stroke="#000" stroke-width="1" fill="none"/>
            </svg>

            <img src="https://win98icons.alexmeub.com/icons/png/loudspeaker_rays-0.png" class="tray-icon" title="Звук" alt="sound">
            <span id="time">12:00</span>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;
        }
        updateTime();
        setInterval(updateTime, 10000);

        function openWindow(id) {
            closeAll();
            document.getElementById('window-' + id).style.display = 'flex';
            if (id === 'game') {
                initGame();
            }
        }

        function closeWindow(id) {
            document.getElementById('window-' + id).style.display = 'none';
        }

        function closeAll() {
            const windows = document.querySelectorAll('.window');
            windows.forEach(win => win.style.display = 'none');
        }

        const wishes = [
            { text: "ДЕНЬГИ", icon: "💰" },
            { text: "ЗДОРОВЬЕ", icon: "🏥" },
            { text: "ЛЮБОВЬ", icon: "❤️" },
            { text: "УСПЕХ", icon: "🏆" },
            { text: "СЧАСТЬЕ", icon: "✨" },
            { text: "ДРУЗЬЯ", icon: "🤝" },
            { text: "ВАЙБ", icon: "🎧" },
            { text: "МЕЧТЫ", icon: "🚀" },
            { text: "УДАЧА", icon: "🍀" }
        ];

        function initGame() {
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = '';

            wishes.forEach((wish, index) => {
                const box = document.createElement('div');
                box.className = 'gift-box';
                box.id = `gift-${index}`;
                box.onclick = () => openGift(index);

                const icon = document.createElement('div');
                icon.className = 'gift-icon';
                icon.textContent = '❓';

                const text = document.createElement('div');
                text.className = 'wish-text';
                text.textContent = wish.text;

                box.appendChild(icon);
                box.appendChild(text);
                gameArea.appendChild(box);
            });
        }

        function openGift(index) {
            const box = document.getElementById(`gift-${index}`);
            if (box.classList.contains('open')) return;

            box.classList.add('open');
            const wish = wishes[index];
            const iconDiv = box.querySelector('.gift-icon');
            iconDiv.textContent = wish.icon;

            if (document.querySelectorAll('.gift-box.open').length === wishes.length) {
                setTimeout(() => alert("🎉 Все пожелания найдены! Пусть они обязательно сбудутся!"), 300);
            }
        }
    </script>
</body>
</html>
