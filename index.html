    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('https://fonts.cdnfonts.com/s/77332/Pixelated.woff') format('woff');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pixel', 'Courier New', monospace;
            user-select: none;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #000;
        }

        /* УВЕЛИЧЕННАЯ ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            height: 65px;
            background-color: #121212;
            color: #ff66cc;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #333;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            z-index: 10;
            padding-top: env(safe-area-inset-top, 0px);
        }

        /* ПРИТЕМНЁННЫЙ КЛЕТЧАТЫЙ ФОН */
        .desktop {
            flex: 1;
            background-color: #8b008b;
            background-image:
                linear-gradient(45deg, #0a0a0a 25%, transparent 25%),
                linear-gradient(-45deg, #0a0a0a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #0a0a0a 75%),
                linear-gradient(-45deg, transparent 75%, #0a0a0a 75%);
            background-size: 44px 44px;
            background-position: 0 0, 0 22px, 22px -22px, -22px 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            position: relative;
        }

        /* ИКОНКИ НА РАБОЧЕМ СТОЛЕ */
        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
            cursor: pointer;
        }

        .icon-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .icon-text {
            font-size: 14px;
            text-align: center;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 3px 8px;
            border-radius: 3px;
            margin-top: 6px;
            border: 1px dashed #ff66cc;
        }

        /* РЕТРО-ОКНА */
        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 380px;
            background-color: #c0c0c0;
            border: 3px solid;
            border-color: #fff #808080 #808080 #fff;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .window-header {
            height: 32px;
            background: linear-gradient(90deg, #660066 0%, #cc00cc 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .window-controls {
            display: flex;
            gap: 4px;
        }

        .win-btn {
            width: 22px;
            height: 22px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .win-btn:active {
            border-color: #808080 #fff #fff #808080;
        }

        .win-btn.close {
            background-color: #ff4500;
            color: white;
        }

        .window-body {
            padding: 12px;
            background-color: #fff;
            margin: 3px;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            max-height: 350px;
            overflow-y: auto;
        }

        .notepad-text {
            width: 100%;
            height: 180px;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #000;
            background: transparent;
            user-select: text;
        }

        /* ИГРА ПОЖЕЛАНИЯ */
        .game-status {
            font-size: 13px;
            color: #333;
            text-align: center;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .game-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            justify-items: center;
        }

        .gift-box {
            width: 75px;
            height: 75px;
            background-color: #ffb6c1;
            border: 3px solid;
            border-color: #fff #ff69b4 #ff69b4 #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            text-align: center;
            padding: 2px;
        }

        .gift-box.open {
            background-color: #fff0f5;
            border-color: #808080 #fff #fff #808080;
            cursor: default;
        }

        .gift-icon {
            font-size: 24px;
        }

        .wish-text {
            display: none;
            font-size: 9px;
            font-weight: bold;
            color: #800080;
            margin-top: 2px;
            word-break: break-word;
        }

        .gift-box.open .wish-text {
            display: block;
        }

        /* АДАПТИРОВАННАЯ НИЖНЯЯ ПАНЕЛЬ ПОД SAFARI/IPHONE */
        .taskbar {
            background-color: #c0c0c0;
            border-top: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px calc(env(safe-area-inset-bottom, 20px) + 6px) 8px;
            z-index: 10;
        }

        .start-button {
            height: 36px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 0 12px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .start-button:active {
            border-color: #808080 #fff #fff #808080;
        }

        .start-icon {
            width: 18px;
            height: 18px;
            background: #cc00cc;
            border: 1px solid #000;
        }

        .taskbar-games {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .game-shortcut {
            width: 30px;
            height: 30px;
            opacity: 0.85;
            filter: drop-shadow(1px 1px 0px #fff);
        }

        .tray {
            height: 36px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            padding: 0 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>

    <div class="window" id="window-game">
        <div class="window-header">
            <span>🎂 pojelania.exe</span>
            <div class="window-controls">
                <button class="win-btn close" onclick="closeWindow('game')">X</button>
            </div>
        </div>
        <div class="window-body">
            <div class="game-status">Нажимай на блочки, чтобы открыть пожелания!</div>
            <div class="game-area" id="game-area"></div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="taskbar">
        <div class="start-button" onclick="alert('System status: Birthday mode Active! 🎉')">
            <div class="start-icon"></div>
            Пуск
        </div>

        <div class="taskbar-games">
            <img src="https://win98icons.alexmeub.com/icons/png/game_freecell-0.png" class="game-shortcut" title="Solitaire" alt="game">
            <img src="https://win98icons.alexmeub.com/icons/png/game_minesweeper-0.png" class="game-shortcut" title="Minesweeper" alt="game">
            <img src="https://win98icons.alexmeub.com/icons/png/joystick-0.png" class="game-shortcut" title="Doom / CS 1.6" alt="game">
        </div>

        <div class="tray">
            <span title="Сеть">🌐</span>
            <span title="Звук">🔊</span>
            <span id="time">12:00</span>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;
        }
        updateTime();
        setInterval(updateTime, 10000);

        function openWindow(id) {
            closeAll();
            document.getElementById('window-' + id).style.display = 'flex';
            if (id === 'game') {
                initGame();
            }
        }

        function closeWindow(id) {
            document.getElementById('window-' + id).style.display = 'none';
        }

        function closeAll() {
            const windows = document.querySelectorAll('.window');
            windows.forEach(win => win.style.display = 'none');
        }

        const wishes = [
            { text: "ДЕНЬГИ", icon: "💰" },
            { text: "ЗДОРОВЬЕ", icon: "🏥" },
            { text: "ЛЮБОВЬ", icon: "❤️" },
            { text: "УСПЕХ", icon: "🏆" },
            { text: "СЧАСТЬЕ", icon: "✨" },
            { text: "ДРУЗЬЯ", icon: "🤝" },
            { text: "ВАЙБ", icon: "🎧" },
            { text: "МЕЧТЫ", icon: "🚀" },
            { text: "УДАЧА", icon: "🍀" }
        ];

        function initGame() {
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = '';

            wishes.forEach((wish, index) => {
                const box = document.createElement('div');
                box.className = 'gift-box';
                box.id = `gift-${index}`;
                box.onclick = () => openGift(index);

                const icon = document.createElement('div');
                icon.className = 'gift-icon';
                icon.textContent = '❓';

                const text = document.createElement('div');
                text.className = 'wish-text';
                text.textContent = wish.text;

                box.appendChild(icon);
                box.appendChild(text);
                gameArea.appendChild(box);
            });
        }

        function openGift(index) {
            const box = document.getElementById(`gift-${index}`);
            if (box.classList.contains('open')) return;

            box.classList.add('open');
            const wish = wishes[index];
            const iconDiv = box.querySelector('.gift-icon');
            iconDiv.textContent = wish.icon;

            if (document.querySelectorAll('.gift-box.open').length === wishes.length) {
                setTimeout(() => alert("🎉 Все пожелания найдены! Пусть они обязательно сбудутся!"), 300);
            }
        }
    </script>
</body>
</html>
