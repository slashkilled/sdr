<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BirthdayOS-v23.08.2026</title>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('https://fonts.cdnfonts.com/s/77332/Pixelated.woff') format('woff');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pixel', 'Courier New', monospace;
            user-select: none;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #000;
        }

        /* УВЕЛИЧЕННАЯ ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            height: 65px;
            background-color: #121212;
            color: #ff66cc;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #333;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            z-index: 20;
            padding-top: env(safe-area-inset-top, 0px);
        }

        /* КОНТЕЙНЕР ЭКРАНА */
        .screen-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #050505;
        }

        /* ЭФФЕКТ ВЫКЛЮЧЕННОГО ЭКРАНА (ЛИНИИ) */
        .off-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.85) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            z-index: 5;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* СКРЫВАЕМ ЛИНИИ И ЗАТЕМНЕНИЕ ПРИ ВКЛЮЧЕНИИ */
        .screen-container.power-on .off-overlay {
            opacity: 0;
            display: none;
        }

        /* РАБОЧИЙ СТОЛ */
        .desktop {
            width: 100%;
            height: 100%;
            background-color: #8b008b;
            background-image:
                linear-gradient(45deg, #0a0a0a 25%, transparent 25%),
                linear-gradient(-45deg, #0a0a0a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #0a0a0a 75%),
                linear-gradient(-45deg, transparent 75%, #0a0a0a 75%);
            background-size: 44px 44px;
            background-position: 0 0, 0 22px, 22px -22px, -22px 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            position: relative;
            opacity: 0;
            pointer-events: none;
        }

        /* ЭФФЕКТ СТАРТА ЭКРАНА */
        .screen-container.power-on .desktop {
            opacity: 1;
            pointer-events: auto;
            animation: crtTurnOn 0.4s ease-out forwards;
        }

        @keyframes crtTurnOn {
            0% {
                transform: scale(1, 0.005) cubic-bezier(0.1, 0.1, 0.1, 1);
                filter: brightness(5);
            }
            50% {
                transform: scale(1, 1) cubic-bezier(0.1, 0.1, 0.1, 1);
                filter: brightness(2);
            }
            100% {
                transform: scale(1, 1);
                filter: brightness(1);
            }
        }

        /* ИКОНКИ НА РАБОЧЕМ СТОЛЕ */
        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
            cursor: pointer;
        }

        .icon-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .icon-text {
            font-size: 14px;
            text-align: center;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 3px 8px;
            border-radius: 3px;
            margin-top: 6px;
            border: 1px dashed #ff66cc;
        }

        /* РЕТРО-ОКНА */
        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 400px;
            background-color: #c0c0c0;
            border: 3px solid;
            border-color: #fff #808080 #808080 #fff;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .window-header {
            height: 32px;
            background: linear-gradient(90deg, #660066 0%, #cc00cc 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .window-controls {
            display: flex;
            gap: 4px;
        }

        .win-btn {
            width: 22px;
            height: 22px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .win-btn:active {
            border-color: #808080 #fff #fff #808080;
        }

        .win-btn.close {
            background-color: #ff4500;
            color: white;
        }

        .window-body {
            padding: 12px;
            background-color: #fff;
            margin: 3px;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            max-height: 380px;
            overflow-y: auto;
        }

        .notepad-text {
            width: 100%;
            height: 220px;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
            color: #000;
            background: transparent;
            user-select: text;
        }

        /* ИГРА ПОЖЕЛАНИЯ */
        .game-status {
            font-size: 13px;
            color: #000;
            text-align: center;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .game-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .gift-box {
            height: 42px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-align: center;
            padding: 4px;
            font-weight: bold;
            font-size: 13px;
            color: #000080;
            transition: background-color 0.1s;
        }

        .gift-box:active {
            border-color: #808080 #ffffff #ffffff #808080;
            padding-top: 6px;
            padding-left: 6px;
        }

        .gift-box.open {
            background-color: #e0e0e0;
            border-color: #808080 #ffffff #ffffff #808080;
            color: #800080;
            cursor: default;
        }

        .dots {
            letter-spacing: 2px;
            font-size: 16px;
            color: #555;
        }

        .wish-text {
            display: none;
            word-break: break-word;
            line-height: 1.2;
        }

        .gift-box.open .dots {
            display: none;
        }

        .gift-box.open .wish-text {
            display: block;
        }

        /* ПОДГОНЕННАЯ НИЖНЯЯ ПАНЕЛЬ */
        .taskbar {
            background-color: #c0c0c0;
            border-top: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 6px;
            padding-left: 8px;
            padding-right: 8px;
            padding-bottom: max(38px, env(safe-area-inset-bottom));
            z-index: 20;
        }

        .start-button {
            height: 36px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 0 12px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .start-button:active, .start-button.active {
            border-color: #808080 #fff #fff #808080;
            background-color: #b0b0b0;
        }

        .start-icon {
            width: 18px;
            height: 18px;
            background: #cc00cc;
            border: 1px solid #000;
        }

        .taskbar-games {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .game-shortcut, .tray-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .tray {
            height: 36px;
            display: flex;
            gap: 6px;
            align-items: center;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            padding: 0 8px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        BirthdayOS-v23.08.2026
    </div>

    <!-- ЭКРАН С ЛИНИЯМИ -->
    <div class="screen-container" id="screen">
        <div class="off-overlay"></div>

        <!-- РАБОЧИЙ СТОЛ -->
        <div class="desktop">

            <!-- ИКОНКА 1: sdr.txt -->
            <div class="icon" onclick="openWindow('notepad')">
                <img src="https://win98icons.alexmeub.com/icons/png/notepad-0.png" class="icon-img" alt="sdr.txt">
                <div class="icon-text">sdr.txt</div>
            </div>

            <!-- ИКОНКА 2: pojelania.exe (SVG ТОРТ) -->
            <div class="icon" onclick="openWindow('game')">
                <svg class="icon-img" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="4" width="2" height="6" fill="#00ffff"/>
                    <rect x="15" y="4" width="2" height="6" fill="#ffff00"/>
                    <rect x="20" y="4" width="2" height="6" fill="#00ffff"/>
                    <rect x="10" y="2" width="2" height="2" fill="#ff4500"/>
                    <rect x="15" y="2" width="2" height="2" fill="#ff4500"/>
                    <rect x="20" y="2" width="2" height="2" fill="#ff4500"/>
                    <rect x="6" y="10" width="20" height="6" fill="#ff69b4"/>
                    <rect x="6" y="10" width="20" height="2" fill="#ffffff"/>
                    <rect x="4" y="16" width="24" height="6" fill="#ba55d3"/>
                    <rect x="4" y="16" width="24" height="2" fill="#ffb6c1"/>
                    <rect x="2" y="22" width="28" height="6" fill="#8a2be2"/>
                    <rect x="2" y="22" width="28" height="2" fill="#ffffff"/>
                    <rect x="0" y="28" width="32" height="2" fill="#c0c0c0"/>
                </svg>
                <div class="icon-text">pojelania.exe</div>
            </div>

        </div>

        <!-- ОКНО 1: БЛОКНОТ -->
        <div class="window" id="window-notepad">
            <div class="window-header">
                <span>📝 sdr.txt - Блокнот</span>
                <div class="window-controls">
                    <button class="win-btn close" onclick="closeWindow('notepad')">X</button>
                </div>
            </div>
            <div class="window-body">
                <textarea class="notepad-text" readonly>
Привет машк!!!!!! поздравляю тебя с дньом рождения с пятнадцати лееетием с так называемым взрослением и новым статусом ну оооочень крутого подростка

продолжай быть сваговой веселой,не теряй штаны и всегда имей при себе ремни.ходи на чехово смейся с фриков иногда фрикуй сама это весело и оставайся на вечном расслабоне даже осознавая что постарела^_^
                </textarea>
            </div>
        </div>

        <!-- ОКНО 2: ИГРА ПОЖЕЛАНИЯ -->
        <div class="window" id="window-game">
            <div class="window-header">
                <span>🎂 pojelania.exe</span>
                <div class="window-controls">
                    <button class="win-btn close" onclick="closeWindow('game')">X</button>
                </div>
            </div>
            <div class="window-body">
                <div class="game-status">нажимай что бы у тебя было…</div>
                <div class="game-area" id="game-area"></div>
            </div>
        </div>

    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="taskbar">
        <div class="start-button" id="start-btn" onclick="togglePower()">
            <div class="start-icon"></div>
            Пуск
        </div>

        <div class="taskbar-games">
            <img src="https://win98icons.alexmeub.com/icons/png/game_freecell-0.png" class="game-shortcut" title="Solitaire" alt="game">
            
            <!-- ПИКСЕЛЬНЫЙ САПЁР -->
            <svg class="game-shortcut" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="4" width="6" height="8" fill="#000000"/>
                <rect x="4" y="5" width="8" height="6" fill="#000000"/>
                <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
                <rect x="7" y="1" width="2" height="3" fill="#000000"/>
                <rect x="7" y="12" width="2" height="3" fill="#000000"/>
                <rect x="1" y="7" width="3" height="2" fill="#000000"/>
                <rect x="12" y="7" width="3" height="2" fill="#000000"/>
                <rect x="3" y="3" width="1" height="1" fill="#000000"/>
                <rect x="12" y="3" width="1" height="1" fill="#000000"/>
                <rect x="3" y="12" width="1" height="1" fill="#000000"/>
                <rect x="12" y="12" width="1" height="1" fill="#000000"/>
            </svg>

            <img src="https://win98icons.alexmeub.com/icons/png/joystick-0.png" class="game-shortcut" title="Joystick" alt="game">
        </div>

        <div class="tray">
            <!-- ПИКСЕЛЬНЫЙ ГЛОБУС С КРЕСТИКОМ -->
            <svg class="tray-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="7" cy="7" r="5.5" stroke="#000000" stroke-width="1.2" fill="none"/>
                <line x1="1.5" y1="7" x2="12.5" y2="7" stroke="#000000" stroke-width="1.2"/>
                <line x1="7" y1="1.5" x2="7" y2="12.5" stroke="#000000" stroke-width="1.2"/>
                <path d="M4 2.5 C 5.5 4.5, 5.5 9.5, 4 11.5" stroke="#000000" stroke-width="1" fill="none"/>
                <path d="M10 2.5 C 8.5 4.5, 8.5 9.5, 10 11.5" stroke="#000000" stroke-width="1" fill="none"/>
                <circle cx="11.5" cy="11.5" r="3.5" fill="#000000"/>
                <path d="M10 10 L13 13 M13 10 L10 13" stroke="#ffffff" stroke-width="1.2"/>
            </svg>

            <img src="https://win98icons.alexmeub.com/icons/png/loudspeaker_rays-0.png" class="tray-icon" title="Звук" alt="sound">
            <span id="time">12:00</span>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;
        }
        updateTime();
        setInterval(updateTime, 10000);

        function togglePower() {
            const screen = document.getElementById('screen');
            const btn = document.getElementById('start-btn');
            
            screen.classList.toggle('power-on');
            btn.classList.toggle('active');

            if (!screen.classList.contains('power-on')) {
                closeAll();
            }
        }

        function openWindow(id) {
            closeAll();
            document.getElementById('window-' + id).style.display = 'flex';
            if (id === 'game') {
                initGame();
            }
        }

        function closeWindow(id) {
            document.getElementById('window-' + id).style.display = 'none';
        }

        function closeAll() {
            const windows = document.querySelectorAll('.window');
            windows.forEach(win => win.style.display = 'none');
        }

        const rawWishes = [
            "деньги",
            "крутые друзья",
            "сабака лиза",
            "Нью роки",
            "демонии тож можно",
            "джейдед лондон",
            "ремни крутые",
            "дорогая косметика",
            "яркие воспоминания",
            "банка рево",
            "близкие",
            "поддержка",
            "опора",
            "любовь",
            "силы",
            "ксаанакс",
            "фен для волос",
            "фен",
            "музыка",
            "арлекин40тыщ"
        ];

        let activeWishes = [];

        function initGame() {
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = '';
            
            activeWishes = [...rawWishes].sort(() => Math.random() - 0.5);

            activeWishes.forEach((wishText, index) => {
                const box = document.createElement('div');
                box.className = 'gift-box';
                box.id = `gift-${index}`;
                box.onclick = () => openGift(index);

                const dots = document.createElement('div');
                dots.className = 'dots';
                dots.textContent = '...';

                const text = document.createElement('div');
                text.className = 'wish-text';
                text.textContent = wishText;

                box.appendChild(dots);
                box.appendChild(text);
                gameArea.appendChild(box);
            });
        }

        function openGift(index) {
            const box = document.getElementById(`gift-${index}`);
            if (box.classList.contains('open')) return;

            box.classList.add('open');

            if (document.querySelectorAll('.gift-box.open').length === activeWishes.length) {
                setTimeout(() => alert("🎉 Все элементы открыты! Теперь у тебя есть абсолютно всё!"), 300);
            }
        }
    </script>
</body>
</html>
